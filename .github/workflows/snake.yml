name: Generate Snake Animation

on:
  # Refresh once a month (00:00 UTC on the 1st)
  schedule:
    - cron: "0 0 1 * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Regenerate whenever you push to main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-gradient.svg?color_snake=#38bdf8&color_dots=#16213e,#1c5a7d,#2a8fc0,#38bdf8,#9be3ff

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
